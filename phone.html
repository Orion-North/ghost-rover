<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141a3c">
<title>Ghost Rovers Phone</title>
<!--
  GHOST ROVERS · PHONE CONTROLLER DESIGN PREVIEW
  An early look at a phone controller. It does NOT connect to the game and sends no input anywhere.
-->
<style>
@font-face{font-family:Fredoka;font-weight:500;font-display:swap;src:url(lib/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url(lib/fredoka-latin-700-normal.woff2) format("woff2")}
:root{--navy:#141a3c;--ghost:#59d8ff;--gold:#ffd23f;--go:#3ddc6f;--rev:#ff9a2e;--dim:#b9c2f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#3443b0,var(--navy) 70%);color:#fff;
  font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:500;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#stars,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.wrap{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:center;gap:10px;
  padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.float{animation:float 4.5s ease-in-out infinite}
.float.b{animation-delay:-2.2s}
@keyframes float{50%{transform:translateY(-5px)}}

/* ---- joystick: a round pad with a chunky knob ---- */
.stick{position:relative;width:min(56vh,27vw,230px);aspect-ratio:1;margin:auto;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.12),rgba(0,0,0,.28) 70%);border:6px solid #fff;
  box-shadow:0 10px 0 rgba(0,0,0,.28),0 0 28px rgba(89,216,255,.35),inset 0 -10px 18px rgba(0,0,0,.25)}
.stick .lit{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .12s;
  background:conic-gradient(from var(--a,0deg),rgba(89,216,255,.95) 0deg,rgba(89,216,255,0) 50deg,rgba(89,216,255,0) 310deg,rgba(89,216,255,.95) 360deg);
  -webkit-mask:radial-gradient(circle,transparent 64%,#000 66%,#000 100%);mask:radial-gradient(circle,transparent 64%,#000 66%,#000 100%);filter:drop-shadow(0 0 10px var(--ghost))}
.stick canvas{position:absolute;inset:-12%;width:124%;height:124%;pointer-events:none}
.stick .knob{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 38% 30%,#bff3ff,var(--ghost) 45%,#1b8fb8 100%);border:5px solid #fff;
  box-shadow:0 7px 0 rgba(0,0,0,.3),0 0 22px rgba(89,216,255,.75)}
.stick .knob::after{content:"";position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,rgba(255,255,255,.35))}

/* ---- middle: title, tag, one line, and the direction label ---- */
.mid{text-align:center;position:relative}
h1{margin:0;font-size:min(9vh,44px);line-height:1;font-weight:700;-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;position:relative;display:inline-block}
h1 span{color:var(--ghost)}
h1 .shine{position:absolute;inset:-4px -10px;pointer-events:none;-webkit-text-stroke:0;color:transparent;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 66%) no-repeat;background-size:40% 100%;background-position:-60% 0;
  -webkit-background-clip:text;background-clip:text;animation:shimmer 7s ease-in-out infinite}
@keyframes shimmer{0%,72%{background-position:-60% 0}88%,100%{background-position:160% 0}}
.badge{display:inline-block;margin:12px 0 10px;background:var(--gold);color:#3a2600;border-radius:999px;padding:5px 16px;font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
p{margin:0;color:var(--dim);font-size:min(1.6vw,16px);line-height:1.35;white-space:nowrap}
.dir{position:absolute;left:50%;top:calc(100% + 14px);transform:translate(-50%,0) scale(.6);opacity:0;white-space:nowrap;
  font-size:min(8vh,34px);font-weight:700;padding:6px 20px;border-radius:999px;border:4px solid #fff;color:var(--navy);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.dir.show{opacity:1;transform:translate(-50%,0) scale(1)}
.dir.fwd{background:var(--go);box-shadow:0 0 26px rgba(61,220,111,.8)}
.dir.rev{background:var(--rev);animation:revglow .8s ease-in-out infinite} /* blinks about 1.25 times a second */
.dir.side{background:var(--ghost);box-shadow:0 0 22px rgba(89,216,255,.8)}
@keyframes revglow{0%,100%{box-shadow:0 0 6px rgba(255,154,46,.4)}50%{box-shadow:0 0 34px rgba(255,154,46,1)}}

/* ---- four round buttons ---- */
.face{display:grid;grid-template-columns:repeat(3,min(18vh,8.2vw,82px));gap:min(3vh,1.4vw,14px);justify-content:center;margin:auto}
.face span{aspect-ratio:1}
.btn{aspect-ratio:1;border-radius:50%;border:5px solid #fff;font:700 min(8vh,34px)/1 Fredoka,system-ui,sans-serif;color:#fff;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;text-shadow:0 3px 0 rgba(0,0,0,.25);
  background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.65),var(--c) 46%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:0 8px 0 color-mix(in srgb,var(--c) 55%,#000),0 0 16px color-mix(in srgb,var(--c) 50%,transparent);transition:transform .08s,box-shadow .12s,filter .12s}
.btn.held{transform:translateY(6px) scale(.94,.88);filter:brightness(1.18);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 55%,#000),0 0 38px var(--c)}
#bT{--c:#2ec79a} #bO{--c:#ff5d6c} #bX{--c:#4f8dff} #bS{--c:#ff6fc4}

.ring{position:fixed;border-radius:50%;pointer-events:none;border:5px solid var(--c);animation:ring .6s ease-out forwards;z-index:5}
@keyframes ring{from{transform:scale(.7);opacity:.95}to{transform:scale(1.9);opacity:0}}
.touch{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);animation:touch .5s ease-out forwards}
@keyframes touch{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}

#turn{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--navy);z-index:9;text-align:center;padding:24px;font-size:24px;font-weight:700}
#turn span{font-size:64px}
@media (orientation:portrait){#turn{display:flex}}
@media (prefers-reduced-motion:reduce){.float,h1 .shine,.dir.rev{animation:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap" aria-label="Ghost Rovers phone controller design preview">
  <div class="float"><div class="stick" id="stick" aria-label="Joystick"><div class="lit" id="lit"></div><canvas id="trail"></canvas><div class="knob" id="knob"></div></div></div>
  <div class="mid">
    <h1>Ghost <span>Rovers</span><span class="shine" aria-hidden="true">Ghost Rovers</span></h1>
    <div><span class="badge">Design preview</span></div>
    <p>Play on the big screen with a controller or keyboard.</p>
    <div class="dir" id="dir"></div>
  </div>
  <div class="float b"><div class="face">
    <span></span><button class="btn" id="bT" aria-label="Triangle">△</button><span></span>
    <button class="btn" id="bS" aria-label="Square">□</button><span></span><button class="btn" id="bO" aria-label="Circle">○</button>
    <span></span><button class="btn" id="bX" aria-label="Cross">✕</button><span></span>
  </div></div>
</div>
<div id="turn"><span>🔄</span>Turn your phone sideways</div>

<script>
(() => {
  const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const stars = $("stars"), sg = stars.getContext("2d"), fx = $("fx"), fg = fx.getContext("2d"), trail = $("trail"), tg = trail.getContext("2d");
  const S = { t: 0, knob: { x: 0, y: 0, vx: 0, vy: 0 }, drag: null, trail: [], lines: [], dir: "" };
  let dpr = 1, W = 0, H = 0;
  function fit() { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; for (const c of [stars, fx]) { c.width = W * dpr; c.height = H * dpr; } const t = trail.getBoundingClientRect(); trail.width = t.width * dpr; trail.height = t.height * dpr; }
  addEventListener("resize", fit); fit();
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };

  // gently twinkling starfield (each star fades in and out slowly)
  const starList = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.4, p: Math.random() * 6.28, s: .4 + Math.random() * .9 }));
  function drawStars() {
    sg.setTransform(dpr, 0, 0, dpr, 0, 0); sg.clearRect(0, 0, W, H); sg.fillStyle = "#fff";
    for (const s of starList) { sg.globalAlpha = .25 + .6 * (.5 + .5 * Math.sin(S.t * s.s + s.p)); sg.beginPath(); sg.arc(s.x * W, s.y * H, s.r, 0, 7); sg.fill(); }
    sg.globalAlpha = 1;
  }

  // a soft ripple under every finger (screen recordings don't show fingers)
  addEventListener("pointerdown", e => { const d = document.createElement("span"); d.className = "touch"; d.style.left = e.clientX + "px"; d.style.top = e.clientY + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 520); }, true);

  // ---- buttons: squish while pressed, glow while held, ripple ring in their own colour, light buzz ----
  document.querySelectorAll(".btn").forEach(b => {
    const on = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) { } b.classList.add("held"); buzz(15);
      const r = b.getBoundingClientRect(), ring = document.createElement("span"); ring.className = "ring";
      Object.assign(ring.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" }); ring.style.setProperty("--c", getComputedStyle(b).getPropertyValue("--c"));
      document.body.appendChild(ring); setTimeout(() => ring.remove(), 650); };
    const off = () => b.classList.remove("held");
    b.addEventListener("pointerdown", on); ["pointerup", "pointercancel", "lostpointercapture"].forEach(n => b.addEventListener(n, off));
    b.addEventListener("contextmenu", e => e.preventDefault());
  });

  // ---- joystick: the knob follows your thumb, then springs back to the middle with a bounce ----
  const stick = $("stick"), knob = $("knob"), lit = $("lit");
  const R = () => stick.getBoundingClientRect().width * .3;
  function knobTo(e) { const r = stick.getBoundingClientRect(), m = R(); let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2); const d = Math.hypot(x, y); if (d > m) { x *= m / d; y *= m / d; } S.knob.x = x; S.knob.y = y; S.knob.vx = S.knob.vy = 0; }
  stick.addEventListener("pointerdown", e => { e.preventDefault(); try { stick.setPointerCapture(e.pointerId); } catch (x) { } S.drag = e.pointerId; knobTo(e); buzz(10); });
  stick.addEventListener("pointermove", e => { if (e.pointerId === S.drag) knobTo(e); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(n => stick.addEventListener(n, e => { if (e.pointerId === S.drag) S.drag = null; }));

  // which way is the stick pushed? show a big label so it's clear in a screen recording
  function setDir(d) {
    if (d === S.dir) return; S.dir = d; const el = $("dir");
    if (!d) { el.classList.remove("show"); return; }
    el.textContent = { fwd: "▲ FORWARD", rev: "▼ REVERSE", left: "◀ LEFT", right: "RIGHT ▶" }[d];
    el.className = "dir " + (d === "fwd" ? "fwd" : d === "rev" ? "rev" : "side"); void el.offsetWidth; el.classList.add("show");
  }

  function drawFx(dt) {
    fg.setTransform(dpr, 0, 0, dpr, 0, 0); fg.clearRect(0, 0, W, H);
    const k = S.knob;
    // glowing trail behind the knob (drawn on its own layer inside the joystick)
    tg.setTransform(dpr, 0, 0, dpr, 0, 0); const tw = trail.width / dpr, th = trail.height / dpr, cx = tw / 2, cy = th / 2; tg.clearRect(0, 0, tw, th);
    S.trail.forEach(p => p.a -= dt * 1.4); S.trail = S.trail.filter(p => p.a > 0);
    const l = S.trail[S.trail.length - 1]; if (!l || Math.hypot(l.x - k.x, l.y - k.y) > 2) S.trail.push({ x: k.x, y: k.y, a: 1 });
    tg.lineCap = "round"; tg.strokeStyle = "#59d8ff"; tg.shadowColor = "#59d8ff"; tg.shadowBlur = 22;
    for (let i = 1; i < S.trail.length; i++) { const a = S.trail[i - 1], b = S.trail[i]; tg.globalAlpha = Math.min(1, b.a * 1.1); tg.lineWidth = 8 + 22 * b.a; tg.beginPath(); tg.moveTo(cx + a.x, cy + a.y); tg.lineTo(cx + b.x, cy + b.y); tg.stroke(); }
    tg.globalAlpha = 1; tg.shadowBlur = 0;
    // speed lines streak past while pushing forward
    if (S.dir === "fwd" && Math.random() < .7) S.lines.push({ x: W * (.3 + Math.random() * .4), y: -40, v: 900 + Math.random() * 600, l: 30 + Math.random() * 50 });
    for (const s of S.lines) s.y += s.v * dt * (S.dir === "fwd" ? 1 : .6);
    S.lines = S.lines.filter(s => s.y < H + 80);
    fg.strokeStyle = "rgba(255,255,255,.55)"; fg.lineWidth = 3;
    for (const s of S.lines) { fg.beginPath(); fg.moveTo(s.x, s.y); fg.lineTo(s.x, s.y + s.l); fg.stroke(); }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; S.t += dt;
    const k = S.knob, m = R();
    if (S.drag === null) { k.vx += (-260 * k.x - 9 * k.vx) * dt; k.vy += (-260 * k.y - 9 * k.vy) * dt; k.x += k.vx * dt; k.y += k.vy * dt; }
    knob.style.transform = "translate(" + k.x + "px," + k.y + "px)";
    const mag = clamp(Math.hypot(k.x, k.y) / m, 0, 1);
    lit.style.opacity = mag > .12 ? Math.min(1, mag * 1.3) : 0; lit.style.setProperty("--a", (Math.atan2(k.x, -k.y) * 180 / Math.PI) + "deg"); // the ring lights up on the side being pushed
    setDir(S.drag === null || mag < .35 ? "" : Math.abs(k.y) > Math.abs(k.x) ? (k.y < 0 ? "fwd" : "rev") : (k.x < 0 ? "left" : "right"));
    drawStars(); drawFx(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.phoneDemo = S; // for screenshots and testing
})();
</script>
</body>
</html>
