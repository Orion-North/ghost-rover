<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141a3c">
<title>Ghost Rovers Phone</title>
<!--
  GHOST ROVERS · PHONE CONTROLLER DESIGN PREVIEW
  A demo of what a Ghost Rovers phone controller could look like.
  It does NOT connect to the game and sends no input anywhere.
  Everything here is drawn by code; the buttons are our own rover-themed design.
-->
<style>
@font-face{font-family:Fredoka;font-weight:500;font-display:swap;src:url(lib/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url(lib/fredoka-latin-700-normal.woff2) format("woff2")}
:root{--ink:#141a3c;--accent:#59d8ff;--gold:#ffd23f;--go:#3ddc6f;--back:#ff9a2e;--dim:#b9c2f0;--bg:#05071a}
body.mars{--accent:#ffb36b;--bg:#1e0b06}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:500;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;transition:background .6s}
button{font:inherit;color:inherit;cursor:pointer;padding:0}
#stars{position:fixed;inset:0;width:100%;height:100%;display:block}
.app{position:fixed;inset:0;display:grid;grid-template-columns:27% 1fr 31%;gap:12px;align-items:center;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* ---- joystick: a glowing little planet with a chunky wheel-shaped knob ---- */
.joy{position:relative;width:min(100%,64vh);aspect-ratio:1;margin:auto}
.joy .base{position:absolute;inset:0;border-radius:50%;border:5px solid #fff;
  background:radial-gradient(circle at 28% 62%,rgba(0,0,0,.18) 0 9%,transparent 10%),radial-gradient(circle at 66% 30%,rgba(0,0,0,.16) 0 7%,transparent 8%),radial-gradient(circle at 72% 72%,rgba(0,0,0,.14) 0 6%,transparent 7%),
    radial-gradient(circle at 35% 30%,#d9dce6,#8f93a3 70%);
  box-shadow:0 8px 0 rgba(0,0,0,.3),0 0 30px var(--accent),inset -12px -14px 0 rgba(0,0,0,.18);transition:background .6s,box-shadow .6s}
body.mars .joy .base{background:radial-gradient(circle at 30% 64%,rgba(90,25,8,.3) 0 9%,transparent 10%),radial-gradient(circle at 64% 30%,rgba(90,25,8,.25) 0 7%,transparent 8%),radial-gradient(circle at 50% 4%,#fff 0 10%,transparent 11%),
    radial-gradient(circle at 35% 30%,#f2a06a,#b9522b 70%)}
.joy canvas{position:absolute;inset:-15%;width:130%;height:130%;pointer-events:none}
.knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;pointer-events:none;will-change:transform}
.knob svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.joylab{position:absolute;left:0;right:0;bottom:-6%;text-align:center;font-size:13px;color:var(--dim);font-weight:700;letter-spacing:1px}

/* ---- the dashboard in the middle ---- */
.dash{position:relative;height:min(94vh,340px);border:5px solid #fff;border-radius:28px;overflow:hidden;background:#0b1030;
  box-shadow:0 10px 0 rgba(0,0,0,.3),0 0 26px rgba(89,216,255,.25)}
.dash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:10px;bottom:10px;background:var(--gold);color:#3a2600;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.worlds{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(20,26,60,.75);border:3px solid #fff;border-radius:999px;padding:3px}
.worlds button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--dim)}
.worlds button.on{background:var(--accent);color:var(--ink)}
.banner{position:absolute;left:0;top:44%;padding:6px 18px 6px 14px;border-radius:0 999px 999px 0;font-size:20px;font-weight:700;color:var(--ink);
  transform:translateX(-110%);transition:transform .35s cubic-bezier(.2,1.5,.4,1);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.banner.show{transform:translateX(0)} .banner.fwd{background:var(--go)} .banner.rev{background:var(--back)}
.bubble{position:absolute;left:44%;top:16%;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:20px;padding:4px 14px;font-size:22px;font-weight:700;
  transform:scale(0);transform-origin:20% 100%;pointer-events:none}
.bubble::after{content:"";position:absolute;left:18px;bottom:-14px;border:8px solid transparent;border-top:10px solid var(--ink)}
.bubble.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:scale(0)}25%{transform:scale(1.1)}35%,80%{transform:scale(1)}100%{transform:scale(0)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.photo{position:absolute;right:12px;bottom:12px;width:30%;background:#fff;padding:5px 5px 18px;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.35);
  transform:translateY(140%) rotate(8deg);pointer-events:none}
.photo img{width:100%;display:block;border-radius:3px}
.photo.go{animation:snap 2.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes snap{0%{transform:translateY(140%) rotate(8deg)}20%,75%{transform:translateY(0) rotate(-6deg)}100%{transform:translate(40%,160%) rotate(14deg)}}

/* ---- buttons on the right ---- */
.ctrls{display:grid;grid-template-rows:auto 1fr;gap:12px;height:min(94vh,340px)}
.smalls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rb{height:min(17vh,64px);border-radius:22px;border:4px solid #fff;background:#3a4180;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:15px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s,background .15s,box-shadow .15s}
.rb .i{font-size:24px}
.rb.held{transform:translateY(4px) scale(.94,.88);box-shadow:0 1px 0 rgba(0,0,0,.35),0 0 22px var(--accent);background:#5967d6}
.rb.on{background:var(--accent);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 22px var(--accent)}
.pedals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pedal{border-radius:30px;border:5px solid #fff;font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .15s,filter .15s}
.pedal .i{font-size:38px;line-height:1}
#drive{background:linear-gradient(180deg,#7ff0a2,var(--go))} #back{background:linear-gradient(180deg,#ffc27a,var(--back))}
.pedal.held{transform:translateY(6px) scale(.95,.9);filter:brightness(1.12);animation:glow 1.2s ease-in-out infinite}
#drive.held{--g:rgba(61,220,111,.95)} #back.held{--g:rgba(255,154,46,.95)}
@keyframes glow{0%,100%{box-shadow:0 2px 0 rgba(0,0,0,.35),0 0 14px var(--g)}50%{box-shadow:0 2px 0 rgba(0,0,0,.35),0 0 40px var(--g)}}

/* a glowing ripple wherever you touch */
.ripple{position:fixed;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:4px solid var(--accent);pointer-events:none;animation:rip .6s ease-out forwards;z-index:5}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(4.5);opacity:0}}

#turn{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ink);z-index:9;text-align:center;padding:24px;font-size:24px;font-weight:700}
#turn span{font-size:64px}
@media (orientation:portrait){#turn{display:flex}}
@media (prefers-reduced-motion:reduce){.pedal.held{animation:none}}
</style>
</head>
<body class="moon">
<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
  <div class="joy" id="joy" aria-label="Steering joystick">
    <div class="base"></div>
    <canvas id="trail"></canvas>
    <div class="knob" id="knob"><svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="#30333d" stroke="#fff" stroke-width="7"/>
      <g stroke="#141a3c" stroke-width="6" stroke-linecap="round"><path d="M50 10v14M50 76v14M10 50h14M76 50h14M22 22l10 10M68 68l10 10M78 22l-10 10M22 78l10-10"/></g>
      <circle cx="50" cy="50" r="22" fill="var(--accent)" stroke="#fff" stroke-width="6"/><circle cx="50" cy="50" r="7" fill="#fff"/>
    </svg></div>
    <div class="joylab">STEER</div>
  </div>

  <div class="dash" id="dash">
    <canvas id="scene" aria-label="Rover dashboard"></canvas>
    <div class="worlds"><button id="wMoon" class="on">🌕 Moon</button><button id="wMars">🔴 Mars</button></div>
    <div class="banner" id="banner"></div>
    <div class="bubble" id="bubble">BEEP!</div>
    <div class="flash" id="flash"></div>
    <div class="photo" id="photo"><img id="photoImg" alt="A snapshot of the rover"></div>
    <div class="tag">Design preview</div>
  </div>

  <div class="ctrls">
    <div class="smalls">
      <button class="rb" id="bLights" aria-label="Lights"><span class="i">🔦</span>Lights</button>
      <button class="rb" id="bScan" aria-label="Scan"><span class="i">📡</span>Scan</button>
      <button class="rb" id="bPhoto" aria-label="Photo"><span class="i">📸</span>Photo</button>
      <button class="rb" id="bHorn" aria-label="Horn"><span class="i">🔊</span>Horn</button>
    </div>
    <div class="pedals">
      <button class="pedal" id="back" aria-label="Back"><span class="i">▼</span>BACK</button>
      <button class="pedal" id="drive" aria-label="Drive"><span class="i">▲</span>DRIVE</button>
    </div>
  </div>
</div>
<div id="turn"><span>🔄</span>Turn your phone sideways</div>

<script>
(() => {
  const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a);
  const S = { t: 0, steer: 0, speed: 0, drive: false, back: false, lights: false, scanT: 0, world: "moon", ground: 0, wheel: 0, lastPhoto: -9,
    knob: { x: 0, y: 0, vx: 0, vy: 0 }, drag: null, trail: [], dust: [], lines: [], blipT: -1 };
  const PAL = {
    moon: { sky1: "#060a24", sky2: "#26306e", hill: "#3b4064", ground: "#a3a6b4", ground2: "#7f8292", rock: "#5d6070", dust: "220,220,230", star: "#ffffff" },
    mars: { sky1: "#b97849", sky2: "#f2c79c", hill: "#c9794c", ground: "#dd6f3c", ground2: "#b9522b", rock: "#8e3a1f", dust: "240,170,120", star: "#ffe2c4" }
  };
  let P = PAL.moon;

  // ---- sizing ----
  const scene = $("scene"), g = scene.getContext("2d"), stars = $("stars"), sg = stars.getContext("2d"), trail = $("trail"), tg = trail.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  function fit() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const c of [scene, stars, trail]) { const r = c.getBoundingClientRect(); c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr); }
    const r = scene.getBoundingClientRect(); W = r.width; H = r.height;
  }
  addEventListener("resize", fit); fit();

  // ---- slowly drifting starfield ----
  const starList = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), z: rnd(.2, 1) }));
  function drawStars(dt) {
    const w = stars.width, h = stars.height; sg.clearRect(0, 0, w, h); sg.fillStyle = P.star;
    for (const s of starList) { s.x -= dt * .006 * s.z * (1 + Math.abs(S.speed) * 3); if (s.x < 0) s.x += 1; sg.globalAlpha = .25 + .6 * s.z; sg.fillRect(s.x * w, s.y * h, 1.5 * dpr * s.z + .5, 1.5 * dpr * s.z + .5); }
    sg.globalAlpha = 1;
  }

  // ---- held buttons squish and stay lit; every touch shows a ripple ----
  addEventListener("pointerdown", e => { const r = document.createElement("span"); r.className = "ripple"; r.style.left = e.clientX + "px"; r.style.top = e.clientY + "px"; document.body.appendChild(r); setTimeout(() => r.remove(), 650); audio(); }, true);
  function hold(el, down, up) {
    el.addEventListener("pointerdown", e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) { } el.classList.add("held"); down && down(); });
    const off = () => { if (!el.classList.contains("held")) return; el.classList.remove("held"); up && up(); };
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(n => el.addEventListener(n, off));
    el.addEventListener("contextmenu", e => e.preventDefault());
  }
  hold($("drive"), () => S.drive = true, () => S.drive = false);
  hold($("back"), () => S.back = true, () => S.back = false);
  hold($("bLights"), () => { S.lights = !S.lights; $("bLights").classList.toggle("on", S.lights); });
  hold($("bScan"), () => { if (S.scanT <= 0) { S.scanT = 3.2; S.blipT = -1; } });
  hold($("bPhoto"), photo);
  hold($("bHorn"), horn);

  // ---- Moon / Mars ----
  function setWorld(w) { S.world = w; P = PAL[w]; document.body.className = w; $("wMoon").classList.toggle("on", w === "moon"); $("wMars").classList.toggle("on", w === "mars"); }
  $("wMoon").onclick = () => setWorld("moon"); $("wMars").onclick = () => setWorld("mars");

  // ---- joystick: drag the knob, it springs back with a bounce when you let go ----
  const joy = $("joy"), knob = $("knob");
  const joyR = () => joy.getBoundingClientRect().width * .32;
  function knobTo(e) { const r = joy.getBoundingClientRect(), R = joyR(); let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2); const d = Math.hypot(x, y); if (d > R) { x *= R / d; y *= R / d; } S.knob.x = x; S.knob.y = y; S.knob.vx = S.knob.vy = 0; }
  joy.addEventListener("pointerdown", e => { e.preventDefault(); try { joy.setPointerCapture(e.pointerId); } catch (x) { } S.drag = e.pointerId; knobTo(e); });
  joy.addEventListener("pointermove", e => { if (e.pointerId === S.drag) knobTo(e); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(n => joy.addEventListener(n, e => { if (e.pointerId === S.drag) S.drag = null; }));

  // ---- sounds (made by code, very short) ----
  let ac = null;
  function audio() { if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) try { ac = new A(); } catch (x) { } } if (ac && ac.state === "suspended") ac.resume(); }
  function tone(f, d, type, vol, at) { if (!ac) return; const t = ac.currentTime + (at || 0), o = ac.createOscillator(), v = ac.createGain(); o.type = type || "square"; o.frequency.value = f; v.gain.setValueAtTime(vol || .08, t); v.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t + d + .02); }

  // ---- Horn: a BEEP! bubble.  Photo: a flash and a little photo pops out (at most every 0.7 s) ----
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function horn() { restart($("bubble"), "pop"); tone(523, .16, "square", .07); tone(659, .2, "square", .07, .17); }
  function photo() {
    if (S.t - S.lastPhoto < .7) return; S.lastPhoto = S.t;
    restart($("flash"), "go"); tone(1400, .05, "sine", .06);
    try { $("photoImg").src = scene.toDataURL("image/jpeg", .7); } catch (x) { }
    restart($("photo"), "go");
  }

  // ---- drawing the rover and its little world ----
  function wheelAt(x, y, r, spin, squash) {
    g.save(); g.translate(x, y); g.scale(squash, 1);
    g.fillStyle = "#30333d"; g.strokeStyle = "#141a3c"; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke();
    g.rotate(spin); g.strokeStyle = "#ff9a2e"; g.lineWidth = 3.5; for (let i = 0; i < 3; i++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(-r * .7, 0); g.lineTo(r * .7, 0); g.stroke(); }
    g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(0, 0, r * .3, 0, 7); g.fill(); g.lineWidth = 2.5; g.strokeStyle = "#141a3c"; g.stroke(); g.restore();
  }
  function rr(x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
  function ghost(x, y, s, a) { g.save(); g.globalAlpha = a; g.translate(x, y); g.fillStyle = "#59d8ff"; g.strokeStyle = "#fff"; g.lineWidth = 2;
    g.beginPath(); g.arc(0, -s * .2, s * .7, Math.PI, 0); g.lineTo(s * .7, s * .6); for (let i = 1; i <= 3; i++) g.quadraticCurveTo(s * .7 - (i - .5) * s * .47, s * .3, s * .7 - i * s * .47, s * .6); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#141a3c"; g.beginPath(); g.arc(-s * .25, -s * .2, s * .12, 0, 7); g.arc(s * .25, -s * .2, s * .12, 0, 7); g.fill(); g.restore(); }

  function draw(dt) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gy = H * .74, sky = g.createLinearGradient(0, 0, 0, gy); sky.addColorStop(0, P.sky1); sky.addColorStop(1, P.sky2); g.fillStyle = sky; g.fillRect(0, 0, W, H);
    if (S.world === "moon") { g.fillStyle = "#fff"; for (let i = 0; i < 24; i++) g.fillRect((i * 97 - S.ground * .05 % W + W * 2) % W, (i * 41) % (gy * .8), 1.5, 1.5); }
    // far hills (slow) and ground (fast)
    g.fillStyle = P.hill; g.beginPath(); g.moveTo(0, gy); for (let x = 0; x <= W + 20; x += 20) { const w = x + S.ground * .25; g.lineTo(x, gy - 18 - Math.sin(w * .013) * 12 - Math.sin(w * .031) * 6); } g.lineTo(W, gy); g.fill();
    g.fillStyle = P.ground; g.fillRect(0, gy, W, H - gy); g.fillStyle = P.ground2; g.fillRect(0, gy, W, 5);
    g.fillStyle = "rgba(0,0,0,.18)"; for (let i = 0; i < 6; i++) { const x = ((i * 137 - S.ground) % (W + 120) + W + 120) % (W + 120) - 60; g.beginPath(); g.ellipse(x, gy + 18 + (i % 3) * 14, 22 + (i % 2) * 14, 5, 0, 0, 7); g.fill(); }
    // speed lines streak past when going fast
    if (Math.abs(S.speed) > .45 && Math.random() < Math.abs(S.speed)) S.lines.push({ x: S.speed > 0 ? W + 20 : -60, y: rnd(H * .25, gy - 10), l: rnd(30, 70) });
    g.lineWidth = 3; g.lineCap = "round";
    for (const l of S.lines) { l.x -= S.speed * 900 * dt; l.a = Math.min(1, (l.a == null ? 1 : l.a) - (Math.abs(S.speed) < .45 ? dt * 3 : 0)); g.strokeStyle = "rgba(255,255,255," + (.7 * Math.max(0, l.a)) + ")"; g.beginPath(); g.moveTo(l.x, l.y); g.lineTo(l.x + l.l, l.y); g.stroke(); }
    S.lines = S.lines.filter(l => l.x > -100 && l.x < W + 100 && (l.a == null || l.a > 0)); // they fade away when the rover slows down
    // the rover
    const rx = W * .44, ry = gy, lean = S.steer * .14, bob = Math.sin(S.t * 18) * Math.min(2, Math.abs(S.speed) * 3);
    if (S.lights) { const hl = g.createLinearGradient(rx + 50, 0, rx + 50 + W * .5, 0); hl.addColorStop(0, "rgba(255,250,200,.95)"); hl.addColorStop(.6, "rgba(255,248,190,.35)"); hl.addColorStop(1, "rgba(255,248,190,0)");
      g.fillStyle = hl; g.beginPath(); g.moveTo(rx + 52, ry - 44 + bob); g.lineTo(rx + 52 + W * .5, ry - 110); g.lineTo(rx + 52 + W * .5, ry + 6); g.closePath(); g.fill(); }
    // dust puffs from the wheels while moving (they fall straight down on the Moon)
    if (Math.abs(S.speed) > .08 && Math.random() < Math.abs(S.speed) * 1.4) { const back = S.speed > 0 ? -1 : 1; S.dust.push({ x: rx + back * 44, y: ry - 6, vx: back * rnd(40, 110) * Math.abs(S.speed), vy: -rnd(30, 70), r: rnd(4, 9), a: .8 }); }
    for (const d of S.dust) { d.x += d.vx * dt - S.speed * 300 * dt; d.y += d.vy * dt; d.vy += (S.world === "moon" ? 160 : 40) * dt; d.a -= dt * (S.world === "moon" ? 1.1 : .7); d.r += dt * 6; if (d.y > ry - 2) { d.y = ry - 2; d.vy = 0; } }
    S.dust = S.dust.filter(d => d.a > 0);
    for (const d of S.dust) { g.fillStyle = "rgba(" + P.dust + "," + d.a.toFixed(2) + ")"; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill(); }
    g.save(); g.translate(rx, ry + bob); g.rotate(lean);
    // mast, head and eyes (looking the way you steer)
    g.strokeStyle = "#cbd3de"; g.lineWidth = 7; g.beginPath(); g.moveTo(14, -54); g.lineTo(14, -78); g.stroke();
    rr(-8, -104, 46, 30, 9); g.fillStyle = "#f5f3ec"; g.fill(); g.strokeStyle = "#141a3c"; g.lineWidth = 4; g.stroke();
    for (const ex of [6, 24]) { g.fillStyle = "#fff"; g.beginPath(); g.arc(ex, -89, 7, 0, 7); g.fill(); g.lineWidth = 2.5; g.stroke(); g.fillStyle = "#141a3c"; g.beginPath(); g.arc(ex + 2 + S.steer * 3, -89, 3.2, 0, 7); g.fill(); }
    g.strokeStyle = "#cbd3de"; g.lineWidth = 3; g.beginPath(); g.moveTo(-34, -54); g.lineTo(-34 - S.speed * 10, -82); g.stroke(); g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(-34 - S.speed * 10, -84, 5, 0, 7); g.fill(); g.lineWidth = 2.5; g.strokeStyle = "#141a3c"; g.stroke();
    // body and solar panel
    rr(-58, -56, 116, 40, 12); g.fillStyle = "#ff9a2e"; g.fill(); g.lineWidth = 4; g.strokeStyle = "#141a3c"; g.stroke();
    rr(-48, -50, 56, 12, 4); g.fillStyle = "#2f55b5"; g.fill(); g.lineWidth = 3; g.stroke();
    // headlights (front) and the blinking reverse light (back): it blinks about once a second
    g.fillStyle = S.lights ? "#fff8be" : "#fff3b0"; g.beginPath(); g.arc(58, -38, 6, 0, 7); g.fill(); g.lineWidth = 2.5; g.stroke();
    const revOn = S.back && Math.floor(S.t * 2.5) % 2 === 0; g.fillStyle = revOn ? "#ff5d2a" : "#7a3b30"; g.beginPath(); g.arc(-58, -36, 6, 0, 7); g.fill(); g.stroke();
    if (revOn) { const rg = g.createRadialGradient(-58, -36, 0, -58, -36, 30); rg.addColorStop(0, "rgba(255,93,42,.7)"); rg.addColorStop(1, "rgba(255,93,42,0)"); g.fillStyle = rg; g.beginPath(); g.arc(-58, -36, 30, 0, 7); g.fill(); }
    g.restore();
    // wheels spin with speed; the front wheel turns (squashes) with steering
    S.wheel += S.speed * dt * 14;
    wheelAt(rx - 40, ry - 12, 15, S.wheel, 1); wheelAt(rx, ry - 12, 15, S.wheel, 1); wheelAt(rx + 40, ry - 12, 15, S.wheel, 1 - Math.abs(S.steer) * .45);
    if (Math.abs(S.steer) > .2) { g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 4; g.beginPath(); const s = Math.sign(S.steer); g.arc(rx + 70, ry - 70, 22, s > 0 ? -2.4 : -.7, s > 0 ? -.7 : -2.4, s < 0); g.stroke();
      const a = s > 0 ? -.7 : -2.4, ax = rx + 70 + Math.cos(a) * 22, ay = ry - 70 + Math.sin(a) * 22; g.fillStyle = "#fff"; g.beginPath(); g.arc(ax, ay, 5, 0, 7); g.fill(); }
    // speedometer
    const sx = 56, sy = 66, sr = 40, f = Math.min(1, Math.abs(S.speed));
    g.lineCap = "round"; g.lineWidth = 9; g.strokeStyle = "rgba(255,255,255,.25)"; g.beginPath(); g.arc(sx, sy, sr, Math.PI, 0); g.stroke();
    g.strokeStyle = S.speed < -.02 ? "#ff9a2e" : "#3ddc6f"; g.beginPath(); g.arc(sx, sy, sr, Math.PI, Math.PI + Math.PI * f); g.stroke();
    const na = Math.PI + Math.PI * f; g.strokeStyle = "#fff"; g.lineWidth = 4; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(na) * (sr - 8), sy + Math.sin(na) * (sr - 8)); g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(sx, sy, 5, 0, 7); g.fill();
    g.font = "700 15px Fredoka, system-ui, sans-serif"; g.textAlign = "center"; g.fillText(Math.round(f * 18) + " km/h", sx, sy + 20);
    // signal meter (strong while scanning)
    const lvl = S.scanT > 0 ? 4 : clamp(Math.round(2 + 1.4 * Math.sin(S.t * .7)), 1, 3);
    for (let i = 0; i < 4; i++) { const bx = W - 66 + i * 12, bh = 8 + i * 7; g.fillStyle = i < lvl ? (S.world === "moon" ? "#59d8ff" : "#ffd23f") : "rgba(255,255,255,.25)"; rr(bx, 52 - bh, 8, bh, 3); g.fill(); }
    g.fillStyle = "#fff"; g.font = "700 11px Fredoka, system-ui, sans-serif"; g.fillText("SIGNAL", W - 44, 66);
    // radar sweep with a ghost blip while scanning
    if (S.scanT > 0) {
      const cx = W - 70, cy = H * .5, r = Math.min(56, H * .2), a = S.t * Math.PI * 1.6;
      g.fillStyle = "rgba(6,40,30,.8)"; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.strokeStyle = "#3ddc6f"; g.lineWidth = 2; for (const k of [1, .66, .33]) { g.beginPath(); g.arc(cx, cy, r * k, 0, 7); g.stroke(); }
      const sw = g.createConicGradient ? g.createConicGradient(a - .9, cx, cy) : null;
      if (sw) { sw.addColorStop(0, "rgba(61,220,111,0)"); sw.addColorStop(.14, "rgba(61,220,111,.55)"); sw.addColorStop(.15, "rgba(61,220,111,0)"); g.fillStyle = sw; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); }
      g.strokeStyle = "#bfffcf"; g.lineWidth = 3; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); g.stroke();
      if (S.blipT < 0 && 3.2 - S.scanT > .6) S.blipT = 0; if (S.blipT >= 0) S.blipT += dt;
      if (S.blipT >= 0) { const ba = Math.min(1, S.blipT * 2.5) * Math.min(1, S.scanT * 2); g.fillStyle = "rgba(89,216,255," + (.4 * ba) + ")"; g.beginPath(); g.arc(cx + r * .45, cy - r * .3, 13 + Math.sin(S.t * 5) * 2, 0, 7); g.fill(); ghost(cx + r * .45, cy - r * .3, 11, ba);
        g.globalAlpha = ba; g.fillStyle = "#fff"; g.font = "700 12px Fredoka, system-ui, sans-serif"; g.fillText("GHOST!", cx, cy + r + 15); g.globalAlpha = 1; }
    }
  }

  // ---- joystick trail ----
  function drawTrail(dt) {
    const w = trail.width, h = trail.height; tg.setTransform(1, 0, 0, 1, 0, 0); tg.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, k = dpr; S.trail.forEach(p => p.a -= dt * 1.6); S.trail = S.trail.filter(p => p.a > 0);
    const last = S.trail[S.trail.length - 1]; if (!last || Math.hypot(last.x - S.knob.x, last.y - S.knob.y) > 2) S.trail.push({ x: S.knob.x, y: S.knob.y, a: 1 });
    tg.lineCap = "round"; tg.strokeStyle = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#59d8ff"; tg.shadowColor = tg.strokeStyle; tg.shadowBlur = 14 * k;
    for (let i = 1; i < S.trail.length; i++) { const a = S.trail[i - 1], b = S.trail[i]; tg.globalAlpha = b.a * .8; tg.lineWidth = (4 + 10 * b.a) * k; tg.beginPath(); tg.moveTo(cx + a.x * k, cy + a.y * k); tg.lineTo(cx + b.x * k, cy + b.y * k); tg.stroke(); }
    tg.globalAlpha = 1; tg.shadowBlur = 0;
  }

  // ---- main loop ----
  let last = performance.now(), banner = "";
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; S.t += dt;
    if (S.drag === null) { const K = S.knob; K.vx += (-260 * K.x - 9 * K.vx) * dt; K.vy += (-260 * K.y - 9 * K.vy) * dt; K.x += K.vx * dt; K.y += K.vy * dt; } // springy bounce back to the middle
    const R = joyR(); S.steer = clamp(S.knob.x / R, -1, 1);
    knob.style.transform = "translate(" + S.knob.x + "px," + S.knob.y + "px) rotate(" + (S.steer * 70) + "deg)";
    const target = S.drive ? 1 : S.back ? -.6 : 0; S.speed += clamp(target - S.speed, -1.6 * dt, 1.1 * dt); S.ground += S.speed * 300 * dt;
    S.scanT = Math.max(0, S.scanT - dt); $("bScan").classList.toggle("on", S.scanT > 0);
    const want = S.drive ? "fwd" : S.back ? "rev" : "";
    if (want !== banner) { banner = want; const b = $("banner"); if (want) { b.textContent = want === "fwd" ? "▲ FORWARD" : "▼ REVERSE"; b.className = "banner " + want; void b.offsetWidth; b.classList.add("show"); } else b.classList.remove("show"); }
    drawStars(dt); draw(dt); drawTrail(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.phoneDemo = S; // for screenshots and testing
})();
