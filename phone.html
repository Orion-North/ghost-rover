<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghost Rovers Phone</title>
<style>
/* Placeholder for the phone controller design preview. It doesn't connect to the game or send any input. */
@font-face{font-family:Fredoka;font-weight:500;font-display:swap;src:url(lib/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url(lib/fredoka-latin-700-normal.woff2) format("woff2")}
:root{--navy:#141a3c;--ghost:#59d8ff;--gold:#ffd23f;--go:#3ddc6f;--rev:#ff5d6c;--dim:#b9c2f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#3443b0,var(--navy) 70%);color:#fff;
  font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:500;overflow:hidden;user-select:none;-webkit-user-select:none}
.wrap{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;gap:12px;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.stick{width:min(38vh,160px);aspect-ratio:1;border-radius:50%;margin:auto;background:rgba(0,0,0,.25);border:5px solid #fff;position:relative;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.stick::after{content:"";position:absolute;inset:28%;border-radius:50%;background:var(--ghost);border:4px solid #fff;box-shadow:0 0 18px var(--ghost)}
.mid{text-align:center}
h1{margin:0;font-size:28px;font-weight:700;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill}
h1 span{color:var(--ghost)}
.badge{display:inline-block;margin:8px 0;background:var(--gold);color:#3a2600;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
p{margin:0;color:var(--dim);font-size:15px;line-height:1.35}
.face{display:grid;grid-template-columns:repeat(3,min(12vh,56px));gap:8px;justify-content:center;margin:auto}
.face i{font-style:normal;font-weight:700;aspect-ratio:1;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.face i:empty{border:0;box-shadow:none}
@media (orientation:portrait){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr}.mid{order:-1}}
</style>
</head>
<body>
<div class="wrap" aria-label="Ghost Rovers phone controller design preview">
  <div class="stick" aria-hidden="true"></div>
  <div class="mid">
    <h1>Ghost <span>Rovers</span></h1>
    <div class="badge">Design preview</div>
    <p>This is an early look at the phone controller. It doesn't drive the rover yet. Play on the big screen with a controller or the keyboard.</p>
  </div>
  <div class="face" aria-hidden="true">
    <i></i><i style="background:#4fe0b0">△</i><i></i>
    <i style="background:#ff8fd8">□</i><i></i><i style="background:var(--rev)">○</i>
    <i></i><i style="background:#7db4ff">✕</i><i></i>
  </div>
</div>
</body>
</html>
